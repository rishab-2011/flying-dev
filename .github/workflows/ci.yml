# Runs the checks a contributor runs locally, on every pull request and on main.
#
# Two jobs. `test` is the suite the deploying host does not run: a build command
# only compiles, so without this a pull request could merge, deploy, and reach
# customers with the suite failing and nothing would have said so.
#
# `image` builds the Docker image that ECS actually runs (see deploy.yml). It is
# separate because it proves a different thing -- not that the code is correct,
# but that the artefact assembles and serves. Both halves of that have broken
# before in ways a passing test suite would not have noticed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push supersedes the run in flight for the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flyingdev
          POSTGRES_PASSWORD: flyingdev
          POSTGRES_DB: flyingdev
        ports:
          - 5432:5432
        # The health check names the role and database explicitly. Bare
        # pg_isready probes as the invoking user -- root inside the container --
        # which makes Postgres log a FATAL every interval and passes merely
        # because the server answered at all. This checks the credentials the
        # app actually uses. (These comments sit outside the folded block on
        # purpose: inside it they would be passed to docker as arguments.)
        options: >-
          --health-cmd "pg_isready -U flyingdev -d flyingdev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # A throwaway database inside the runner, thrown away when the job ends.
      # This must never point at Neon: the suite signs up customers, creates
      # bookings, edits a price and posts a review.
      DATABASE_URL: postgresql://flyingdev:flyingdev@localhost:5432/flyingdev
      DIRECT_URL: postgresql://flyingdev:flyingdev@localhost:5432/flyingdev
      # Not a secret. It signs cookies for a database that exists for four
      # minutes. The real one lives only in Netlify.
      SESSION_SECRET: ci-only-throwaway-session-secret
      # The catalogue seed is opt-in; without it the runner's database is empty
      # and every test that needs a phone model fails.
      SEED_ON_BUILD: "1"
      # The suite signs in as this admin.
      ADMIN_PHONE: "9000000001"
      ADMIN_PASSWORD: flyingdev-admin
      NEXT_PUBLIC_WHATSAPP_NUMBER: "918587949104"
      NEXT_PUBLIC_SUPPORT_PHONE: "+91 85879 49104"
      # Left unset on purpose: tests/datadog.mjs asserts that with no
      # credentials the SDK never loads and no banner appears.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches NODE_VERSION in netlify.toml. If these drift, CI stops
          # testing what actually gets deployed.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        # Only Chromium: the suite drives nothing else, and the other two
        # browsers are a slow download for no coverage.
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        # Also applies migrations and seeds the catalogue, exactly as the
        # Netlify build command does.
        run: npm run build

      - name: Start the app
        run: |
          nohup npm run start > /tmp/app.log 2>&1 &
          # Wait on /api/health rather than /, so this also proves the app can
          # reach the database before any test blames a missing model on itself.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "The app never became healthy. Server log:"
          cat /tmp/app.log
          exit 1

      - name: Test
        run: npm test

      - name: Server log
        # The browser tests fail with a Playwright timeout that says nothing
        # about why; the server's own log usually does.
        if: failure()
        run: cat /tmp/app.log

  image:
    name: Build the container image
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # The image build is not a formality: `next build` prerenders /repair/[brand]
    # and the sitemap, so it opens the database. Without a server here the
    # Dockerfile could only be proven correct by a failed production deploy.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: flyingdev
          POSTGRES_PASSWORD: flyingdev
          POSTGRES_DB: flyingdev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flyingdev -d flyingdev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://flyingdev:flyingdev@localhost:5432/flyingdev
      DIRECT_URL: postgresql://flyingdev:flyingdev@localhost:5432/flyingdev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Prepare the database the build reads
        run: |
          npm ci
          npx prisma migrate deploy
          SEED_ON_BUILD=1 node scripts/seed-on-build.mjs

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: flying-dev:ci
          # The database is on the runner's own loopback, which the build only
          # reaches on the host network.
          network: host
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            database_url=${{ env.DATABASE_URL }}
            direct_url=${{ env.DIRECT_URL }}
          build-args: |
            NEXT_PUBLIC_DD_ENV=sandbox
            NEXT_PUBLIC_DD_VERSION=${{ github.sha }}

      - name: Run it and check it serves
        run: |
          docker run -d --name flying-dev-ci --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e DIRECT_URL="$DIRECT_URL" \
            -e SESSION_SECRET=ci-only-throwaway-session-secret \
            flying-dev:ci

          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "healthy after ${i}s"
              # A container that boots but serves an unstyled page is the
              # failure this catches: .next/static is not part of the
              # standalone output and has to be copied in separately.
              chunk=$(docker exec flying-dev-ci sh -c 'ls .next/static/chunks/*.js | head -1' | sed 's|.next/static/||')
              curl -fsS -o /dev/null "http://localhost:3000/_next/static/$chunk"
              echo "static assets served ($chunk)"
              curl -sS http://localhost:3000/api/health
              exit 0
            fi
            sleep 1
          done
          echo "The container never became healthy:"
          docker logs flying-dev-ci
          exit 1

      - name: Container log
        if: failure()
        run: docker logs flying-dev-ci || true
